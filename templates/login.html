<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
    <form method="post">
        {{ form.hidden_tag() }}

        <div>
            {{ form.email(placeholder='Email') }}
            {% for error in form.email.errors %}
                <span style="color: red">[{{ error }}]</span>
            {% endfor %}
        </div>

        <br>

        <div>
            {{ form.password(placeholder='Password') }}
            {% for error in form.password.errors %}
                <span style="color: red">[{{ error }}]</span>
            {% endfor %}
        </div>

        <br>

        <div>
            {{ form.submit }}
        </div>
    </form>

    <label>Don't have an account? Register one <a href="{{ url_for('register') }}">here</a></label>
</body>
</html>
